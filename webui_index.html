<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>wmflow 积木工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#0f1115; --panel:#181b22; --panel2:#1f242e; --line:#2c3340;
    --fg:#e6e9ef; --dim:#9aa3b2; --acc:#4f8cff; --ok:#3fb96f; --warn:#e0a33e; --err:#e05e5e;
    --c-image:#4f8cff; --c-msg:#e0a33e; --c-metrics:#3fb96f; --c-tensor:#b573ff;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI",system-ui,sans-serif; display:flex;
         flex-direction:column; overflow:hidden; }
  header { padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex:none; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  select,button,input,textarea { background:var(--panel2); color:var(--fg);
      border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:none; border-radius:0; padding:5px 14px; opacity:.6; }
  .seg button.on { opacity:1; background:var(--acc); color:#fff; }

  .main { flex:1; display:flex; min-height:0; }
  .canvas-wrap { flex:1; position:relative; overflow:auto; }
  .canvas { position:relative; min-width:1800px; min-height:100%; }
  .canvas svg.links { position:absolute; inset:0; width:100%; height:100%;
      pointer-events:none; overflow:visible; }

  /* ---- 节点卡片 (ComfyUI 式) ---- */
  .node { position:absolute; width:252px; background:var(--panel);
          border:1px solid var(--line); border-radius:10px; overflow:hidden;
          box-shadow:0 4px 18px rgba(0,0,0,.35); }
  .node .head { padding:7px 11px; font-size:12.5px; font-weight:600;
                background:var(--panel2); border-bottom:1px solid var(--line);
                display:flex; align-items:center; gap:8px; }
  .node .head .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .node .head .badge { margin-left:auto; font-size:10px; font-weight:500;
      padding:1px 7px; border-radius:99px; background:#2a3140; color:var(--dim); }
  .node .body { padding:8px 11px; }
  .port-row { display:flex; align-items:center; gap:6px; font-size:11px;
              height:22px; position:relative; }
  .port-row.out { justify-content:flex-end; text-align:right; }
  .port-dot { width:10px; height:10px; border-radius:50%; flex:none;
              border:2px solid var(--bg); position:absolute; }
  .port-row.in .port-dot { left:-16px; }
  .port-row.out .port-dot { right:-16px; }
  .port-row .pname { color:var(--dim); }
  .port-row .ptype { font-family:ui-monospace,monospace; font-size:10px;
                     padding:0 5px; border-radius:4px; background:#263042; }
  .preview { margin-top:7px; }
  .preview img { width:100%; border-radius:6px; display:block;
                 background:#000; image-rendering:auto; }
  .bits { display:flex; flex-wrap:wrap; gap:2px; }
  .bits i { width:9px; height:9px; border-radius:2px; display:block; }
  .kvs { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .kvs .k { color:var(--dim); font-size:11px; }
  .kvs .v { font-family:ui-monospace,monospace; font-size:13px; font-weight:600; }
  .caption { color:var(--dim); font-size:10.5px; margin-top:4px;
             font-family:ui-monospace,monospace; }
  .tag { display:inline-block; font-size:10px; padding:0 6px; border-radius:4px;
         background:#263042; color:var(--dim); margin:1px 2px 1px 0; }

  /* ---- 右栏 ---- */
  .side { width:340px; flex:none; border-left:1px solid var(--line);
          background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .side .tabs { display:flex; border-bottom:1px solid var(--line); flex:none; }
  .side .tabs button { flex:1; border:none; border-radius:0; padding:9px 4px;
                       opacity:.55; border-bottom:2px solid transparent; }
  .side .tabs button.on { opacity:1; border-bottom-color:var(--acc); }
  .side .pane { flex:1; overflow-y:auto; padding:12px 14px; }
  .side textarea { width:100%; font-family:ui-monospace,monospace; font-size:11.5px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:9px; }
  .status { font-size:12px; color:var(--dim); }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .legend { display:flex; gap:12px; font-size:11px; color:var(--dim); }
  .legend b { display:inline-block; width:10px; height:10px; border-radius:50%;
              margin-right:4px; vertical-align:-1px; }
  .ctrl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 16px;
          background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  .ctrl label { font-size:12px; color:var(--dim); display:flex; gap:5px;
                align-items:center; }
</style>
</head>
<body>

<header>
  <h1>wmflow</h1>
  <div class="seg">
    <button id="view-pipe" class="on" onclick="setView('pipe')">流水线</button>
    <button id="view-blocks" onclick="setView('blocks')">积木链</button>
  </div>
  <span class="sub">节点图 · 输入输出直视 · 服务器算力</span>
  <div style="flex:1"></div>
  <div class="legend">
    <span><b style="background:var(--c-image)"></b>IMAGE</span>
    <span><b style="background:var(--c-msg)"></b>MESSAGE</span>
    <span><b style="background:var(--c-metrics)"></b>METRICS</span>
    <span><b style="background:var(--c-tensor)"></b>TENSOR</span>
  </div>
</header>

<div class="ctrl" id="ctrl-pipe">
  <label>框架 <select id="fw">
    <option value="lsb_toy">lsb_toy (真嵌入演示)</option>
    <option value="hidden">hidden (HiDDeN)</option>
    <option value="stegastamp">stegastamp</option>
    <option value="mbrs">mbrs</option>
  </select></label>
  <label>退化层 <select id="layer">
    <option value="none">none</option><option value="combo_builtin">combo_builtin</option>
    <option value="jpeg">jpeg</option><option value="blur">blur</option>
    <option value="noise">noise</option>
  </select></label>
  <label>转码 <select id="preset">
    <option value="none">none</option><option value="wechat_lite">wechat_lite</option>
    <option value="chroma420">chroma420</option><option value="jpeg75">jpeg75</option>
    <option value="resize_half">resize_half</option>
  </select></label>
  <label>strength <input id="strength" type="number" value="1.0" step="0.1"
    min="0" max="1" style="width:64px"></label>
  <label>seed <input id="seed" type="number" value="0" style="width:72px"></label>
  <label>载体图 <input id="cover" type="file" accept="image/*" style="width:180px"></label>
  <button class="primary" onclick="runDemo()">▶ 运行流水线</button>
  <span id="pipeStatus" class="status"></span>
</div>

<div class="ctrl" id="ctrl-blocks" style="display:none">
  <label>网络 <select id="part">
    <option value="encoder">encoder</option><option value="decoder">decoder</option>
  </select></label>
  <label>框架 <select id="fw2">
    <option value="hidden">hidden</option><option value="stegastamp">stegastamp</option>
    <option value="mbrs">mbrs</option>
  </select></label>
  <button class="primary" onclick="runTrace()">▶ 逐积木追踪</button>
  <button onclick="loadBlocks()">重置</button>
  <span id="blockStatus" class="status"></span>
</div>

<div class="main">
  <div class="canvas-wrap" id="wrap">
    <div class="canvas" id="canvas">
      <svg class="links" id="links"></svg>
    </div>
  </div>
  <div class="side">
    <div class="tabs">
      <button id="tab-llm" class="on" onclick="setSide('llm')">LLM Prompt</button>
      <button id="tab-edit" onclick="setSide('edit')">节点编辑</button>
    </div>
    <div class="pane" id="pane-llm">
      <div class="row">
        <select id="pmode">
          <option value="describe">框架描述</option>
          <option value="debug">找 bug</option>
          <option value="tune">调参</option>
        </select>
        <button class="primary" onclick="genPrompt()">生成</button>
        <button onclick="copyPrompt()">复制</button>
      </div>
      <div class="row"><textarea id="problem" rows="2"
        placeholder="debug: 问题现象"></textarea></div>
      <div class="row"><textarea id="tb" rows="2"
        placeholder="debug: 报错/日志"></textarea></div>
      <div class="row"><input id="metrics" style="width:100%"
        placeholder='tune: {"ber":0.21,"psnr":28}'></div>
      <div class="row"><input id="goal" style="width:100%"
        value="tune 目标: 降低 BER 同时保持 PSNR"></div>
      <textarea id="prompt" rows="14" readonly></textarea>
      <div class="row" style="margin-top:8px">
        <textarea id="reply" rows="5" placeholder="贴模型回复 (含 patch JSON)"></textarea>
      </div>
      <div class="row">
        <button onclick="applyReply()">解析并套用补丁</button>
        <span id="replyStatus" class="status"></span>
      </div>
    </div>
    <div class="pane" id="pane-edit" style="display:none">
      <div class="status">点击积木链节点进行编辑 (换积木/改参数)</div>
      <div id="editBox"></div>
    </div>
  </div>
</div>

<script>
const TYPE_COLOR = { IMAGE:'var(--c-image)', MESSAGE:'var(--c-msg)',
  METRICS:'var(--c-metrics)', TENSOR:'var(--c-tensor)', WM_MODEL:'var(--err)',
  PARAMS:'var(--dim)' };
const $ = id => document.getElementById(id);
let RECIPES=null, MODULES=null;
let view='pipe', graph={nodes:[],links:[]}, blocksSpec=null, editSel=null;

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify(body)} : {method:'GET'};
  const r = await fetch(path, opt);
  return r.json();
}

/* ================= 画布渲染: 节点 + 贝塞尔连线 ================= */
function renderGraph() {
  const canvas = $('canvas');
  [...canvas.querySelectorAll('.node')].forEach(n => n.remove());
  const svg = $('links');
  svg.innerHTML = '';
  const pos = {};
  for (const n of graph.nodes) {
    pos[n.id] = {x:n.x, y:n.y, w:252, inY:[], outY:[]};
    const div = document.createElement('div');
    div.className = 'node';
    div.style.left = n.x+'px'; div.style.top = n.y+'px';
    const color = TYPE_COLOR[n.tint] || 'var(--acc)';
    let ports = '';
    (n.inputs||[]).forEach((p,i) => {
      const c = TYPE_COLOR[p.type] || '#888';
      pos[n.id].inY[i] = n.y + 30 + 8 + i*22 + 11;
      ports += `<div class="port-row in"><span class="port-dot"
        style="background:${c}"></span><span class="ptype" style="color:${c}">${p.type}</span>
        <span class="pname">${p.name}</span></div>`;
    });
    (n.outputs||[]).forEach((p,i) => {
      const c = TYPE_COLOR[p.type] || '#888';
      pos[n.id].outY[i] = n.y + 30 + 8 + i*22 + 11;
      ports += `<div class="port-row out"><span class="pname">${p.name}</span>
        <span class="ptype" style="color:${c}">${p.type}</span>
        <span class="port-dot" style="background:${c}"></span></div>`;
    });
    div.innerHTML = `
      <div class="head"><span class="dot" style="background:${color}"></span>
        ${n.title}<span class="badge">${n.badge||''}</span></div>
      <div class="body">${ports}<div class="preview">${n.preview||''}</div>
        <div class="caption">${n.caption||''}</div></div>`;
    if (n.onclick) div.onclick = n.onclick;
    canvas.appendChild(div);
    // 量真实高度以校准连线端口
    const h = div.offsetHeight;
    pos[n.id].h = h;
    const inCount=(n.inputs||[]).length, outCount=(n.outputs||[]).length;
    for (let i=0;i<inCount;i++) pos[n.id].inY[i] = n.y + 38 + 8 + i*22 + 11;
    for (let i=0;i<outCount;i++) pos[n.id].outY[i] = n.y + 38 + 8 + i*22 + 11;
  }
  for (const l of graph.links) {
    const a = pos[l.from[0]], b = pos[l.to[0]];
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.outY[l.from[1]] ?? a.y+40;
    const x2 = b.x, y2 = b.inY[l.to[1]] ?? b.y+40;
    const dx = Math.max(60, Math.abs(x2-x1)*0.45);
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', TYPE_COLOR[l.type]||'#555');
    p.setAttribute('stroke-width','2.5');
    p.setAttribute('opacity','0.85');
    svg.appendChild(p);
  }
}

/* ================= 预览渲染 ================= */
function pvImage(png, caption) {
  return `<img src="data:image/png;base64,${png}">` +
    (caption ? `<div class="caption">${caption}</div>` : '');
}
function pvBits(bits, ref) {
  let s = '<div class="bits">';
  bits.forEach((b,i) => {
    const match = ref ? (b===ref[i]) : true;
    const col = !ref ? (b?'#e0a33e':'#3a4252') : (match ? (b?'#3fb96f':'#2c3340') : '#e05e5e');
    s += `<i style="background:${col}" title="${i}:${b}"></i>`;
  });
  s += '</div>';
  const cap = ref ? `比特 ${bits.length} · 红=错 (对比参考)` : `比特 ${bits.length}`;
  return s + `<div class="caption">${cap}</div>`;
}
function pvKVs(obj) {
  let s = '<div class="kvs">';
  for (const [k,v] of Object.entries(obj))
    s += `<div><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return s + '</div>';
}
function pvThumb(t) {
  if (t.kind==='image' || t.kind==='feat')
    return pvImage(t.png, t.kind==='feat'
      ? `特征图 ${t.ch}ch · 均值热图 · 值域 ${t.range?.join('~')}`
      : (t.psnr!=null ? `PSNR ${t.psnr} dB` : ''));
  if (t.kind==='bits') return pvBits(t.bits, t.ref);
  if (t.kind==='vec')
    return `<div class="caption">logits: ${t.values.slice(0,12).join(', ')}…</div>`;
  return '';
}

/* ================= 流水线视图 ================= */
function pipeGraph(d) {
  const N = d.nodes;
  const g = {nodes:[], links:[]};
  const col = i => 40 + i*300;
  g.nodes.push({id:'cover', x:col(0), y:40, title:'Cover 载体输入',
    tint:'IMAGE', badge:'INPUT',
    outputs:[{name:'image', type:'IMAGE'}], preview:pvImage(N.cover.png)});
  g.nodes.push({id:'msg', x:col(0), y:360, title:'Message 消息输入',
    tint:'MESSAGE', badge:'INPUT',
    outputs:[{name:'bits', type:'MESSAGE'}], preview:pvBits(N.message.bits)});
  g.nodes.push({id:'embed', x:col(1), y:40, title:'Embed 嵌入',
    tint:'IMAGE', badge:d.trained?'':'untrained',
    inputs:[{name:'cover', type:'IMAGE'},{name:'msg', type:'MESSAGE'}],
    outputs:[{name:'image', type:'IMAGE'}],
    preview:pvImage(N.embedded.png, `PSNR ${N.embedded.psnr} dB vs 载体`)});
  g.nodes.push({id:'atk', x:col(2), y:40, title:'Attack 攻击链',
    tint:'IMAGE',
    inputs:[{name:'image', type:'IMAGE'}],
    outputs:[{name:'image', type:'IMAGE'}],
    preview:pvImage(N.attacked.png, `PSNR ${N.attacked.psnr} dB`),
    caption: Object.keys(d.attack_params||{}).length
      ? JSON.stringify(d.attack_params) : 'layer=none, preset=none'});
  g.nodes.push({id:'dec', x:col(3), y:40, title:'Decode 提取',
    tint:'MESSAGE', badge:d.trained?'':'untrained',
    inputs:[{name:'image', type:'IMAGE'}],
    outputs:[{name:'bits', type:'MESSAGE'}],
    preview:pvBits(N.decoded.bits, N.decoded.ref)});
  g.nodes.push({id:'met', x:col(4), y:40, title:'Metrics 度量',
    tint:'METRICS',
    inputs:[{name:'ref', type:'MESSAGE'},{name:'dec', type:'MESSAGE'}],
    outputs:[{name:'metrics', type:'METRICS'}],
    preview:pvKVs(N.metrics)});
  g.links = [
    {from:['cover',0], to:['embed',0], type:'IMAGE'},
    {from:['msg',0], to:['embed',1], type:'MESSAGE'},
    {from:['embed',0], to:['atk',0], type:'IMAGE'},
    {from:['atk',0], to:['dec',0], type:'IMAGE'},
    {from:['msg',0], to:['met',0], type:'MESSAGE'},
    {from:['dec',0], to:['met',1], type:'MESSAGE'},
  ];
  return g;
}

async function runDemo() {
  $('pipeStatus').textContent = '服务器运行中...';
  $('pipeStatus').className = 'status';
  let cover_upload = null;
  const f = $('cover').files[0];
  if (f) cover_upload = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.readAsDataURL(f);
  });
  const d = await api('/api/run_demo', {
    framework: $('fw').value, layer: $('layer').value,
    preset: $('preset').value, strength: +$('strength').value,
    seed: +$('seed').value, cover_upload });
  if (!d.ok) {
    $('pipeStatus').textContent = d.error || '失败';
    $('pipeStatus').className = 'status err'; return;
  }
  graph = pipeGraph(d);
  renderGraph();
  $('pipeStatus').innerHTML = `✓ 完成 · BER <b>${d.nodes.metrics.ber}</b>` +
    (d.trained ? '' : ' · <span style="color:var(--warn)">配方为结构演示 (随机权重)</span>');
  $('pipeStatus').className = 'status ok';
}

/* ================= 积木链视图 ================= */
async function loadBlocks() {
  if (!RECIPES) {
    const [rs, ms] = await Promise.all([api('/api/recipes'), api('/api/modules')]);
    RECIPES = rs.recipes; MODULES = ms.modules;
  }
  const part = $('part').value, fw = $('fw2').value;
  blocksSpec = JSON.parse(JSON.stringify(RECIPES[fw][part]));
  drawBlocks({});
}

function drawBlocks(thumbs) {
  const g = {nodes:[], links:[]};
  const isEnc = !!blocksSpec.input.message;
  // 输入节点
  let y = 40;
  const inIds = {};
  for (const [name, shape] of Object.entries(blocksSpec.input)) {
    const id = 'in_'+name; inIds[name] = id;
    const t = thumbs[name] ? pvThumb(thumbs[name]) : `<div class="caption">shape ${JSON.stringify(shape)}</div>`;
    g.nodes.push({id, x:40, y, title:`输入 ${name}`,
      tint: name==='message'?'MESSAGE':'IMAGE', badge:'INPUT',
      outputs:[{name, type: name==='message'?'MESSAGE':'TENSOR'}], preview:t});
    y += 240;
  }
  const colX = i => 340 + i*272;
  let prevId = 'in_' + Object.keys(blocksSpec.input)[0];
  blocksSpec.modules.forEach((m,i) => {
    const t = thumbs[m.id];
    const md = MODULES[m.type] || {layers:''};
    const inType = m.type==='bit_head' ? 'TENSOR' : 'TENSOR';
    const outType = m.type==='bit_head' ? 'MESSAGE'
      : (m.type==='residual_add' ? 'IMAGE' : 'TENSOR');
    const ins = [];
    const frm = m.from && m.from.length ? m.from : [prevId.replace(/^in_/,'')];
    // 规范化 from → 节点 id
    const fromIds = frm.map(f => f in inIds ? inIds[f]
      : (f.startsWith('in_') ? f : f));
    fromIds.forEach((f,k) => ins.push({name:frm[k], type:
      frm[k]==='message'?'MESSAGE':(frm[k]==='image'?'IMAGE':'TENSOR')}));
    g.nodes.push({
      id:m.id, x:colX(i), y:60+((i%2)*20), title:`${m.id} · ${m.type}`,
      tint: outType, badge:`${(t&&t.shape)?JSON.stringify(t.shape).replace(/[\",]/g,''):''}`,
      inputs: ins,
      outputs:[{name:'out', type: outType}],
      preview: t ? pvThumb(t) : '',
      caption: md.layers,
      onclick: () => openEdit(m.id),
    });
    fromIds.forEach((f,k) => g.links.push({from:[f,0], to:[m.id,k],
      type: ins[k].type}));
    prevId = m.id;
  });
  graph = g; renderGraph();
}

async function runTrace() {
  $('blockStatus').textContent = '追踪中...';
  $('blockStatus').className = 'status';
  if (!blocksSpec) loadBlocks();
  const d = await api('/api/trace', {spec: blocksSpec});
  if (!d.ok) {
    $('blockStatus').textContent = d.error; $('blockStatus').className='status err';
    return;
  }
  drawBlocks(d.thumbs);
  $('blockStatus').innerHTML = `✓ 逐积木输出已显示 · 输出节点 <b>${d.output}</b>`;
  $('blockStatus').className = 'status ok';
}

/* ================= 节点编辑 ================= */
function openEdit(mid) {
  if (view !== 'blocks') return;
  setSide('edit');
  const m = blocksSpec.modules.find(x => x.id === mid);
  editSel = mid;
  const opts = Object.keys(MODULES).map(t =>
    `<option ${t===m.type?'selected':''}>${t}</option>`).join('');
  $('editBox').innerHTML = `
    <h3 style="margin:4px 0 10px">${mid}</h3>
    <div class="row">积木类型 <select id="editType" style="flex:1">${opts}</select></div>
    <div class="row">参数 (JSON)
      <textarea id="editParams" rows="4">${JSON.stringify(m.params||{})}</textarea></div>
    <div class="row"><button class="primary" onclick="applyEdit()">套用 (自动适配)</button>
      <span id="editStatus" class="status"></span></div>
    <div class="caption">${(MODULES[m.type]||{}).layers||''}</div>`;
}

async function applyEdit() {
  const patch = [{id: editSel, replace_type: $('editType').value,
                  params: JSON.parse($('editParams').value || '{}')}];
  const r = await api('/api/swap', {spec: blocksSpec, patch});
  if (!r.ok) { $('editStatus').textContent = r.error; $('editStatus').className='status err'; return; }
  blocksSpec = r.spec;
  drawBlocks({});
  $('editStatus').textContent = '✓ 已套用, 自动适配完成';
  $('editStatus').className = 'status ok';
}

/* ================= LLM prompt ================= */
function setSide(x) {
  ['llm','edit'].forEach(t => {
    $('tab-'+t).className = t===x ? 'on' : '';
    $('pane-'+t).style.display = t===x ? 'block' : 'none';
  });
}
function setView(v) {
  view = v;
  $('view-pipe').className = v==='pipe' ? 'on' : '';
  $('view-blocks').className = v==='blocks' ? 'on' : '';
  $('ctrl-pipe').style.display = v==='pipe' ? 'flex' : 'none';
  $('ctrl-blocks').style.display = v==='blocks' ? 'flex' : 'none';
  if (v==='pipe') { if (!graph.nodes.length) runDemo(); }
  else { if (!blocksSpec) loadBlocks(); else drawBlocks({}); }
}

async function genPrompt() {
  const mode = $('pmode').value;
  const fw = view==='blocks' ? $('fw2').value : $('fw').value;
  const spec = view==='blocks' ? blocksSpec
    : (RECIPES && RECIPES[fw] ? RECIPES[fw].encoder : null);
  const body = {spec: spec || blocksSpec, mode,
    problem: $('problem').value, traceback: $('tb').value,
    metrics: JSON.parse($('metrics').value || '{}'),
    goal: $('goal').value};
  const r = await api('/api/prompt', body);
  $('prompt').value = r.prompt;
}
function copyPrompt() { navigator.clipboard.writeText($('prompt').value); }

async function applyReply() {
  const r = await api('/api/apply_reply',
    {spec: blocksSpec, reply: $('reply').value});
  const s = $('replyStatus');
  if (!r.ok) { s.textContent = '失败: '+r.error; s.className='status err'; return; }
  blocksSpec = r.spec; drawBlocks({});
  s.textContent = '✓ 补丁已套用'; s.className='status ok';
  $('prompt').value = r.prompt;
}

/* ================= 启动 ================= */
(async function init() {
  const [rs, ms] = await Promise.all([api('/api/recipes'), api('/api/modules')]);
  RECIPES = rs.recipes; MODULES = ms.modules;
  runDemo();
})();
</script>
