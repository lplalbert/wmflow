name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run all tests
        run: bash scripts/test_all.sh

  e2e:
    # WebUI 前端回归门禁: 以 token 鉴权启动, 覆盖 ?token= 首页/401 等路径
    # (曾因 continue-on-error 掩盖 token 首页 404 回归)
    runs-on: ubuntu-latest
    env:
      WMFLOW_E2E_TOKEN: wmflow-ci-e2e-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless playwright
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run WebUI e2e
        run: python tests/e2e_webui.py